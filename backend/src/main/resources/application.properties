#
# Denmark Road Assistant - backend configuration (DEFAULT profile)
#
# The default profile is deliberately zero-setup: it uses a file-based H2
# database that the application creates on first start. Nothing has to be
# installed, no database server has to be running, and no password has to be
# typed. This is what a supervisor gets when they clone the project and run it.
#
# To use MySQL instead, start with the "mysql" profile - see
# application-mysql.properties. All database settings live in these two files
# only; no entity or service in the codebase knows which database is in use, so
# swapping in another database later (PostgreSQL, a hosted MySQL, ...) is a
# configuration change, not a code change.
#

spring.application.name=backend
server.port=${SERVER_PORT:8080}

# --- Application settings --------------------------------------------------
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:4200,http://localhost,capacitor://localhost,https://localhost,http://192.168.1.103:4200}
app.ml-service-base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}
app.denmark-center-lat=56.2639
app.denmark-center-lng=9.5018
app.country-code=dk

# --- Weather (Open-Meteo) --------------------------------------------------
# Real hourly forecast used by the prediction. No API key is required.
app.weather-base-url=${WEATHER_BASE_URL:https://api.open-meteo.com/v1/forecast}
app.weather-timeout-seconds=${WEATHER_TIMEOUT_SECONDS:8}

# --- Security --------------------------------------------------------------
# There is NO usable default secret on purpose. In the "dev" profile a random
# key is generated at startup (see application-dev.properties); in any other
# profile the application refuses to start unless APP_JWT_SECRET is supplied.
# See JwtSecretValidator for the exact rule.
app.jwt-secret=${APP_JWT_SECRET:}
app.jwt-expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Database: file-based H2, created automatically on first start ---------
# The file lives in backend/data/ and is git-ignored.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/road-assistant;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# No driver-class-name on purpose. Spring Boot works the driver out from the URL
# above. The old file pinned the MySQL driver separately from the URL, so setting
# only SPRING_DATASOURCE_URL to an H2 address still tried to load the MySQL
# driver and the application failed at startup with a confusing error.

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# The H2 web console is OFF by default. It is enabled only in the dev profile,
# where the matching security rule is also switched on. Leaving a console
# permitted in security config while it is disabled here was dead, confusing
# configuration, so both halves now move together.
spring.h2.console.enabled=false
