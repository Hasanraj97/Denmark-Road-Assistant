#
# Developer profile: convenience only. Never use this in a real deployment.
#
# Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# What it changes:
#  * A random JWT signing key is generated at startup if you have not set
#    APP_JWT_SECRET, so you can run the app without configuring anything.
#    Because the key is new each time, tokens stop working after a restart -
#    that is expected, just log in again.
#  * The H2 web console is switched on at http://localhost:8080/h2-console
#    (JDBC URL jdbc:h2:file:./data/road-assistant, user "sa", empty password),
#    and the matching security rule is enabled only under this profile.
#  * SQL is logged so you can see what Hibernate is doing.
#

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.example.backend=DEBUG
