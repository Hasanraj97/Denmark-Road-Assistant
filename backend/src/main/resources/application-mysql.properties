#
# MySQL profile.
#
# Activate it with either of these:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#   java -jar target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql
#
# Before the first run, create the database once:
#   CREATE DATABASE road_assistant CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# Supply the credentials through the environment rather than editing this file,
# so no password is ever committed:
#   SPRING_DATASOURCE_USERNAME=youruser
#   SPRING_DATASOURCE_PASSWORD=yourpassword
#
# Nothing outside this file assumes MySQL. The entities use portable column
# types only, so the same code runs on H2 and on MySQL unchanged.
#

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/road_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Copenhagen}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:road_assistant}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# The H2 console has no meaning here.
spring.h2.console.enabled=false
