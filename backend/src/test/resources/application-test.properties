#
# Test profile.
#
# Two things matter here.
#
# 1. The database is a private in-memory H2 instance created for the test run
#    and thrown away afterwards. The default profile uses a FILE-based H2 under
#    backend/data/, and a test run must never touch a developer's real data.
#
# 2. The JWT signing key is fixed. The application deliberately generates a
#    random key when APP_JWT_SECRET is unset (see JwtKeyConfig), which is right
#    for local development but useless for tests: a token signed in one test
#    could not be verified in the next. A fixed key also lets a test forge an
#    ALREADY-EXPIRED token with the same key, which is how the "expired session"
#    case is exercised without waiting a day.
#
# The base URLs below point nowhere on purpose. Every collaborator that would
# otherwise make an outgoing HTTP call (GeocodingService, OsrmRoutingService,
# MlServiceClient, WeatherService) is replaced by a mock in the tests, so if one
# of those mocks is ever forgotten the test fails with a connection error
# instead of silently reaching the real Nominatim / OSRM / Open-Meteo.
#

spring.datasource.url=jdbc:h2:mem:road-assistant-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.jwt-secret=denmark-road-assistant-fixed-test-signing-key-0123456789
app.jwt-expiration-ms=86400000

app.ml-service-base-url=http://localhost:1/ml-service-must-be-mocked
app.weather-base-url=http://localhost:1/weather-must-be-mocked

logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# One named administrator for the retraining tests.
app.admin-emails=admin@example.dk
